plugins {
    id 'base'
    id 'jacoco-report-aggregation'
}

dependencies {
    // apps:chat은 아직 안 넣었다 — 지금은 스켈레톤(설정·엔티티·리포지토리 인터페이스)뿐이라
    // 유닛 테스트로 커버할 로직이 거의 없다. 현재 집계 커버리지가 82%대라 헤드룸이
    // 크지 않아서, 정책 엔진(CH6)처럼 실제로 테스트할 로직이 들어오면 그때 추가한다.
    // (리포지토리는 Testcontainers 통합 테스트로 검증하는데, 그 실행 결과는 별도
    // integrationTest 태스크라 이 집계에 안 잡힌다 — apps/chat/build.gradle 참고)
    jacocoAggregation project(':apps:monolith')
    jacocoAggregation project(':libs:core')
    jacocoAggregation project(':libs:security')
    jacocoAggregation project(':libs:storage')
    jacocoAggregation project(':services:domain-api')
    jacocoAggregation project(':services:delivery')
    jacocoAggregation project(':services:notification')
    jacocoAggregation project(':services:dispute')
    jacocoAggregation project(':services:auth')
    jacocoAggregation project(':services:payment')
    jacocoAggregation project(':services:device')
    jacocoAggregation project(':services:reservation')
    jacocoAggregation project(':services:ai')
}

// jacoco-report-aggregation 플러그인은 리포트 태스크를 자동으로 만들어주지 않는다.
// 아래처럼 직접 선언해야 하며, 리포트 이름이 곧 태스크 이름이 된다.
reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            // Gradle 9 에서 testType 은 제거되었다. testSuiteName 을 쓴다.
            testSuiteName = 'test'
        }
    }
}

def aggregatedReport = tasks.named('testCodeCoverageReport', JacocoReport)

aggregatedReport.configure {
    reports {
        xml.required = true
        html.required = true
        // CI(.github/workflows/ci.yml)가 이 경로를 하드코딩하고 있다.
        // 멀티모듈 전환 전과 동일하게 고정해서 CI 를 수정하지 않아도 되게 한다.
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

// 커버리지 게이트는 루트 집계 하나만 둔다.
// 모듈별로 걸면 libs/core 처럼 값 타입 위주이고 테스트가 다른 모듈에 있는 경우
// 첫날부터 실패한다. 소스 총합이 같으므로 집계 비율은 전환 전과 동일해야 한다.
def aggregatedCoverageVerification = tasks.register('aggregatedCoverageVerification', JacocoCoverageVerification) {
    def report = aggregatedReport.get()
    executionData.from(report.executionData)
    classDirectories.from(report.classDirectories)
    sourceDirectories.from(report.sourceDirectories)
    dependsOn report
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn aggregatedReport, aggregatedCoverageVerification
}
