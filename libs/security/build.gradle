plugins {
    id 'iter.spring-library-conventions'
    id 'iter.kotlin-conventions'
}

description = 'iter 인증 공용 - JWT 발급/검증, 인증 주체(AuthUser), 인증 필터'

dependencies {
    // CustomException / ErrorCode 를 쓰고, 이 모듈을 쓰는 쪽도 그 타입을 보게 되므로 api.
    api project(':libs:core')

    api libs.spring.boot.starter.security

    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // JwtPropertiesTest 는 Validator 를 직접 만들어 쓰는 순수 단위 테스트다.
    // hibernate-validator 자체는 libs:core 가 api 로 노출하는 validation 스타터를 타고
    // 이미 들어와 있고, 여기서 필요한 건 JUnit/AssertJ 쪽이다.
    testImplementation libs.spring.boot.starter.validation.test
}
