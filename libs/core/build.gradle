plugins {
    id 'iter.spring-library-conventions'
    // 코틀린 전환 첫 대상. src/main/kotlin 에 파일을 추가하면 바로 컴파일된다.
    id 'iter.kotlin-conventions'
}

description = 'iter 공용 코어 - 응답/예외/페이징/감사 엔티티/메일/요청 로깅'

// 전부 api 로 선언한다. implementation 으로 두면 이 모듈을 쓰는 쪽이 컴파일되지 않는다.
// 아래 타입들이 공개 시그니처에 그대로 노출되기 때문이다:
//   dto        -> Page, Pageable, jakarta.validation
//   entity     -> jakarta.persistence, spring-data 애너테이션
//   exception  -> spring-web, spring-security-access (GlobalExceptionHandler)
//   logging    -> jakarta.servlet(Filter), spring-core task
//   mail       -> JavaMailSender
//   audit      -> jakarta.persistence, spring-data
//
// 참고: 그래서 이 모듈은 얇은 라이브러리가 아니다. data-jpa + webmvc + security +
// validation + mail 을 전이로 끌고 온다. 앞으로 services/* 모듈이 늘어나면
// core-api / core-web / core-jpa 로 쪼개는 선택지를 검토할 것.
dependencies {
    api libs.spring.boot.starter.data.jpa
    api libs.spring.boot.starter.webmvc
    api libs.spring.boot.starter.validation
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.mail

    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.security.test
    testRuntimeOnly libs.h2

    // GlobalExceptionHandlerTest 가 Jackson 2 의 ObjectMapper 를 직접 쓴다.
    // Boot 4.1 웹 스타터는 Jackson 3(tools.jackson)를 주므로 전이로 들어오지 않는다.
    // apps/monolith 에서는 springdoc 을 타고 우연히 들어오고 있었을 뿐이다.
    testImplementation libs.jackson2.databind
}
