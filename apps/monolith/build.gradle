plugins {
    id 'iter.spring-app-conventions'
    id 'iter.kotlin-conventions'
}

description = 'iter'

springBoot {
    mainClass = 'com.example.iter.IterApplicationKt'
}

// 기존 배포 산출물 이름(iter-*.jar)을 유지한다.
base {
    archivesName = 'iter'
}

dependencies {
    implementation project(':libs:core')
    implementation project(':libs:security')
    implementation project(':libs:storage')
    implementation project(':libs:event-contract')
    implementation project(':services:domain-api')
    implementation project(':services:delivery')
    implementation project(':services:notification')
    implementation project(':services:dispute')
    implementation project(':services:auth')
    implementation project(':services:payment')
    implementation project(':services:device')
    implementation project(':services:reservation')
    implementation project(':services:ai')

    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.security.oauth2.client
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.mail
    // apps:chat과 공유하는 유일한 채널 — 채팅 티켓/문의 승인 발급에 쓴다(chatbridge 패키지).
    implementation libs.spring.boot.starter.data.redis

    implementation libs.bouncycastle.bcprov
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    implementation libs.springdoc.openapi.webmvc.ui
    implementation libs.kotlin.reflect
    implementation libs.jackson3.module.kotlin

    implementation libs.spring.boot.starter.flyway
    runtimeOnly libs.flyway.mysql
    runtimeOnly libs.mysql.connector

    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.security.test
    testImplementation libs.spring.boot.starter.security.oauth2.client.test
    testImplementation libs.spring.boot.starter.validation.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.starter.flyway.test
    testImplementation libs.mockito.kotlin
    testRuntimeOnly libs.h2
}

// H2 기반의 빠른 test와 실제 인프라를 쓰는 integrationTest를 소스 수준에서 분리한다.
// 통합 테스트가 늘어나도 기본 build의 실행 시간과 로컬 Docker 유무에 영향을 주지 않는다.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
    // 애플리케이션의 MySQL/Flyway/JWT runtime은 포함하되 testRuntimeOnly의 H2는 제외한다.
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // 실제 MySQL/Redis 위에서 실행하는 통합 테스트에만 Testcontainers를 노출한다.
    integrationTestImplementation libs.spring.boot.testcontainers
    integrationTestImplementation libs.testcontainers.junit.jupiter
    integrationTestImplementation libs.testcontainers.mysql
    integrationTestImplementation libs.testcontainers.redis
    integrationTestRuntimeOnly libs.junit.platform.launcher
}

tasks.register('integrationTest', Test) {
    description = 'Testcontainers 기반 모놀리스 통합 테스트 (Docker 필요)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test

    // DomainBoundaryTest와 같은 경로 기반 검증을 통합 테스트에서도 재사용할 수 있게 한다.
    systemProperty 'iter.repoRoot', rootProject.projectDir.absolutePath
}
