spring:
  application:
    name: iter-chat
  profiles:
    # monolith(application.yaml/application-local.yml)와 같은 패턴. 운영에서는
    # SPRING_PROFILES_ACTIVE로 local이 아닌 값을 명시해서 아래 로컬 기본값들이
    # 조용히 쓰이는 일이 없게 한다.
    default: local
  r2dbc:
    url: ${CHAT_DB_URL}
    username: ${CHAT_DB_USERNAME}
    password: ${CHAT_DB_PASSWORD}
  flyway:
    # R2DBC 에는 마이그레이션 도구가 없어서, 기동 시 이 JDBC url로 딱 1번만 접속해
    # 스키마를 만든다(monolith와 동일한 방식). 그 뒤로는 전부 R2DBC로만 접근한다.
    url: ${CHAT_FLYWAY_URL}
    user: ${CHAT_DB_USERNAME}
    password: ${CHAT_DB_PASSWORD}
  data:
    # monolith와 공유하는 유일한 채널 — 티켓/그랜트 조회, CH5의 메시지 팬아웃(Pub/Sub).
    # JWT 비밀키는 여기 없다 — chat은 티켓만 검증하고 발급은 monolith가 한다.
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

server:
  port: ${CHAT_SERVER_PORT:8081}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n"
  level:
    com.example.iter.chat: debug
