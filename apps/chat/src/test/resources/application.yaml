# src/main/resources/application.yaml 를 테스트에서 완전히 대체한다(같은 파일명+확장자라
# 테스트 클래스패스가 먼저 잡혀서 메인 파일이 안 읽힌다).
#
# spring.r2dbc.* / spring.flyway.* 를 여기서 아예 선언하지 않는 이유: Testcontainers의
# @ServiceConnection이 컨테이너 접속 정보를 런타임에 주입한다. 여기서 기본값(로컬 3306)을
# 선언해 버리면 그 값이 우선순위를 이겨서 컨테이너 대신 로컬 MySQL을 보게 된다.
spring:
  application:
    name: iter-chat-test
