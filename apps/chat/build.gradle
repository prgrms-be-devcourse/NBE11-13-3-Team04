plugins {
    id 'iter.spring-app-conventions'
    id 'iter.kotlin-conventions'
}

description = 'iter 채팅 서비스 — monolith와 별개로 뜨는 독립 앱(WebFlux + 코루틴 + R2DBC)'

springBoot {
    mainClass = 'com.example.iter.chat.ChatApplicationKt'
}

// 두 번째 앱이라 monolith와 산출물 이름이 겹치면 안 된다.
base {
    archivesName = 'iter-chat'
}

dependencies {
    // WebFlux — spring-boot-starter-webmvc(서블릿)과 이 모듈에서 절대 같이 쓰지 않는다.
    implementation libs.spring.boot.starter.webflux
    // Spring Data R2DBC. CoroutineCrudRepository 등 코루틴 리포지토리 지원까지 포함한다.
    implementation libs.spring.boot.starter.data.r2dbc
    implementation libs.r2dbc.mysql
    implementation libs.r2dbc.pool
    implementation libs.kotlinx.coroutines.reactor
    // 티켓/그랜트 조회(monolith가 써 둔 값을 읽기만 함) + 이후 CH5의 메시지 팬아웃(Pub/Sub)에도 쓴다.
    implementation libs.spring.boot.starter.data.redis.reactive

    // 스키마 마이그레이션은 Flyway(JDBC)로만 한다 — R2DBC 에는 마이그레이션 도구가 없다.
    // monolith와 동일한 방식(기동 시 1회)이라 alias 를 그대로 재사용한다.
    implementation libs.spring.boot.starter.flyway
    runtimeOnly libs.flyway.mysql
    runtimeOnly libs.mysql.connector

    testImplementation libs.spring.boot.starter.webflux.test
    testImplementation libs.spring.boot.starter.data.r2dbc.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockito.kotlin

    // 리포지토리 통합 테스트용 — @Tag("integration")으로 분리해서 기본 test 태스크에서는
    // 빼고, integrationTest 태스크에서만 돈다(Docker 없는 로컬에서도 build 가 깨지지 않게).
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.mysql
    testImplementation libs.testcontainers.r2dbc
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Testcontainers(Docker)가 있어야 도는 리포지토리 통합 테스트 전용 태스크.
// 기본 build/check 에는 안 걸려 있다 — CI 워크플로에서 별도 스텝으로 호출한다.
tasks.register('integrationTest', Test) {
    description = 'Testcontainers 기반 리포지토리 통합 테스트 (Docker 필요)'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}
