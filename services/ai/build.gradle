plugins {
    id 'iter.spring-library-conventions'
    id 'iter.kotlin-conventions'
}

description = 'iter AI 작업 오케스트레이션 및 Python AI 서비스 연동'

dependencies {
    implementation project(':libs:core')
    implementation project(':libs:security')
    implementation project(':libs:storage')

    implementation libs.kotlin.reflect
    implementation libs.jackson3.module.kotlin
    implementation libs.springdoc.openapi.webmvc.ui

    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.mockito.kotlin
}

tasks.withType(Test).configureEach {
    systemProperty 'integration.contract.dir', rootProject.file('integration-tests/contracts').absolutePath
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'contract', 'system'
    }
}

tasks.register('systemTest', Test) {
    description = '실행 중인 Python AI Fake 서비스와 Spring HTTP 계약을 검증한다.'
    group = 'verification'
    // Compose가 매번 새 AI 서비스를 띄운다. Gradle 입력만으로 외부 서비스 상태를
    // 추적할 수 없으므로 이전 실행 결과를 재사용하면 실제 연동을 검증하지 못한다.
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'system'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test, contractTest
}

tasks.register('contractTest', Test) {
    description = 'Spring과 Python이 공유하는 AI JSON 계약을 검증한다.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'contract'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}
