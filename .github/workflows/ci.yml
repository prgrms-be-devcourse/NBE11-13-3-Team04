name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # 모노레포 전환은 통합 브랜치(feat/**)에 작업 브랜치(monorepo/**, port/**)를 스택으로 쌓는
    # 방식이라, base가 main/dev가 아니다. 이 패턴이 없으면 전환 작업 PR 전체에 CI가 돌지 않는다.
    #
    # !! branches 는 "어느 브랜치로 향하는 PR인가"(base)를 거른다 !!
    # 작업 브랜치 이름이 아니다. 조건에 안 맞으면 에러가 아니라 아무 일도 안 일어나므로,
    # 새 네임스페이스를 쓸 때는 첫 PR에서 `gh pr checks <번호>`로 반드시 확인할 것.
    branches: [main, dev, 'feat/**', 'monorepo/**', 'port/**', 'schema/**', 'chat/**']

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iter_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # apps:monolith가 spring-boot-starter-data-redis를 물게 되면서(채팅 티켓/그랜트
      # 발급용) LettuceConnectionFactory가 컨텍스트 기동 시점에 공유 커넥션을 미리 여는데,
      # Redis가 없으면 그 시점에 바로 실패한다 — apps:monolith의 모든 @SpringBootTest가
      # 이 서비스가 없으면 깨진다. iter_test 처럼 시크릿 없이 그대로 쓴다.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Run apps:chat integration tests (Testcontainers, Docker 필요)
        # 기본 build 에는 안 걸려 있다 — Docker 없는 로컬에서도 build 가 깨지지 않게
        # 분리했다(apps/chat/build.gradle 참고). ubuntu-latest 러너는 Docker가 기본
        # 설치돼 있어서 여기서는 시크릿 추가 없이 그대로 돈다.
        run: ./gradlew :apps:chat:integrationTest

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 0
          title: 테스트 커버리지 리포트
