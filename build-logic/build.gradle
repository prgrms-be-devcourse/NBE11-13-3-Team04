plugins {
    // src/main/groovy/*.gradle 를 플러그인으로 컴파일한다.
    // 파일명이 곧 플러그인 ID다: iter.java-conventions.gradle -> id 'iter.java-conventions'
    id 'groovy-gradle-plugin'
}

dependencies {
    // 컨벤션 플러그인 안에서 id 'org.springframework.boot' 를 적용하려면
    // 그 플러그인이 컴파일 클래스패스에 있어야 한다.
    implementation "org.springframework.boot:spring-boot-gradle-plugin:${libs.versions.spring.boot.get()}"
}
