import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'iter.java-conventions'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.jetbrains.kotlin.plugin.jpa'
}

// 코틀린을 쓰기 시작하는 모듈이 이 플러그인을 opt-in으로 추가한다(전 모듈 강제 적용 아님).
// src/main/kotlin 이 src/main/java 와 같은 모듈 안에서 공존하며 서로 참조할 수 있다 —
// 그래서 도메인 하나를 한 번에 다 바꾸지 않고 클래스 단위로 점진 전환이 가능하다.
//
// plugin.spring 이 @Component/@Transactional 등이 붙은 클래스를 자동으로 open 처리한다.
// 코틀린 클래스는 기본이 final 이라, 이게 없으면 Spring 이 CGLIB 프록시를 못 씌운다.
//
// plugin.jpa 가 @Entity/@MappedSuperclass/@Embeddable 에 no-arg 생성자를 자동 생성한다.
// 코틀린 클래스는(특히 val 필드가 있으면) 인자 없는 생성자를 자동으로 안 만들어주는데,
// JPA 는 그게 없으면 기동 시점에 예외를 던진다.

// plugin.jpa 는 이 애너테이션들이 붙은 클래스를 open 으로도 열어준다 — allOpen 을 따로
// 설정할 필요가 없다. 바이트코드로 확인했다: @Entity/@MappedSuperclass 는 public class 로,
// 애너테이션 없는 평범한 코틀린 클래스는 public final class 로 컴파일된다.
// (오래된 자료 중 "plugin.jpa 는 no-arg 만 해주니 allOpen 에 jakarta.persistence.Entity 를
//  직접 넣어야 한다"는 설명이 있는데 지금 버전에서는 중복이다. 이게 중요한 이유는 Hibernate 의
//  지연 로딩이 엔티티를 상속해 프록시를 만들기 때문 — 안 열리면 LAZY 가 조용히 EAGER 가 된다.)
kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
        // 자바 쪽 @Nullable/@NonNull 애너테이션을 코틀린 null 안전성에 엄격하게 반영한다.
        freeCompilerArgs.add('-Xjsr305=strict')
        // kotlinc 는 기본 설정에서 List<@NotBlank String> 같은 타입-유즈(type-use) 애너테이션을
        // 바이트코드에 남기지 않는다. 이 플래그가 없으면 Hibernate Validator 가 컬렉션 원소
        // 제약을 못 봐서 검증이 컴파일은 통과한 채로 조용히 꺼진다.
        freeCompilerArgs.add('-Xemit-jvm-type-annotations')
    }
}

dependencies {
    // 코틀린 data class 는 JavaBean 관례(기본 생성자 + setter)를 안 따르고 주 생성자 하나로만
    // 만들어진다. Jackson 은 이 모듈이 없으면 그 생성자를 찾는 방법을 몰라서, HTTP 요청 바디를
    // 코틀린 DTO 로 역직렬화하려 할 때 "no Creators, like default constructor, exist" 로
    // 500 이 난다(컴파일은 통과하고 런타임에만 터져서 놓치기 쉽다).
    //
    // Boot 4.1 의 웹 스타터가 Jackson 3(tools.jackson 패키지)를 쓰므로 그 계열 모듈이 필요하다 —
    // com.fasterxml.jackson.module:jackson-module-kotlin(Jackson 2용)을 넣으면 조용히 안 먹는다.
    // 버전은 명시하지 않는다 — Boot BOM이 임포트하는 tools.jackson:jackson-bom이 관리한다.
    implementation "tools.jackson.module:jackson-module-kotlin"
}
