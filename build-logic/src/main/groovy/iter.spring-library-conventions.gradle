import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'iter.java-conventions'
    // org.springframework.boot 플러그인은 의도적으로 적용하지 않는다.
    //
    // 적용하면 assemble 이 bootJar 에 의존하게 되는데, @SpringBootApplication 이 없는
    // 라이브러리 모듈에서는 bootJar 가
    //   "Main class name has not been configured and it could not be resolved from classpath"
    // 로 빌드를 깨뜨린다. bootJar { enabled = false } 로 덮는 건 증상만 가리는 방법이다.
    //
    // 필요한 건 Spring 의존성 버전 관리뿐이고, 그건 아래 BOM platform 으로 충분하다.
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')
def bom = libs.findLibrary('spring-boot-bom').get()

dependencies {
    // api 로 선언해야 이 모듈을 쓰는 쪽도 동일한 버전 제약을 물려받는다.
    api platform(bom)
    // annotationProcessor / testAnnotationProcessor 는 implementation 을 상속하지 않아
    // 따로 platform 을 넣어줘야 lombok 을 버전 없이 쓸 수 있다.
    annotationProcessor platform(bom)
    testAnnotationProcessor platform(bom)
}
